project:
  type: default
  output-dir: .
  render:
    - slides.qmd

metadata:
  title: "Presentation Title"
  subtitle: "Subtitle"
  author: "Author Name"
  institute: "Department or Unit"
  date: today
  date-format: "D MMMM YYYY"
  lang: en

format:
  beamer:
    theme: default
    colortheme: default
    fontsize: 10pt
    aspectratio: 169
    pdf-engine: lualatex
    section-titles: false
    include-in-header:
      - ./preamble.tex
    header-includes:
      - \graphicspath{{./}}
    fig-pos: "H"
    keep-tex: true
