project:
  type: default
  output-dir: .

format:
  pdf:
    output-file: "report-brief.pdf"
    documentclass: article
    papersize: a4
    fontsize: 11pt
    pdf-engine: lualatex
    geometry:
      - top=20mm
      - bottom=20mm
      - left=22mm
      - right=22mm
    include-in-header:
      - ./preamble-brief.tex
    header-includes:
      - \graphicspath{{./}}
    toc: false
    number-sections: false
    colorlinks: true
    linkcolor: linkblue
    urlcolor: linkblue
    citecolor: linkblue
    fig-pos: "H"
    keep-tex: true
