project:
  type: default
  output-dir: .
  render:
    - report.qmd   # master file that includes sections/_*.qmd partials

metadata:
  title: "Report Title"
  subtitle: "Subtitle"
  author: "Author Name"
  department: "Department or Unit"
  email: "email@example.com"
  date: today
  date-format: "D MMMM YYYY"
  lang: en

  # Layout options (see before-body.tex and preamble.tex)
  inline-title: false       # true = compact inline title block + logo header
  section-newpage: true     # false = continuous flow, no page break per section

crossref:
  fig-title: Figure
  tbl-title: Table
  fig-prefix: Figure
  tbl-prefix: Table

format:
  pdf:
    output-file: "report.pdf"
    documentclass: article
    papersize: a4
    fontsize: 11pt
    pdf-engine: lualatex
    geometry:
      - top=25mm
      - bottom=25mm
      - left=25mm
      - right=25mm
    template-partials:
      - ./before-body.tex
    include-in-header:
      - ./preamble.tex
    header-includes:
      - \graphicspath{{./}}
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    linkcolor: linkblue
    urlcolor: linkblue
    citecolor: linkblue
    fig-pos: "H"
    keep-tex: true
