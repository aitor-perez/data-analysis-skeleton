project:
  type: default
  output-dir: .
  render:
    - dashboard.qmd

metadata:
  title: "Dashboard Title"
  subtitle: "Subtitle"
  author: "Author Name"
  department: "Department or Unit"
  email: "email@example.com"
  date: today
  date-format: "D MMMM YYYY"
  lang: en

plotly:
  connected: true

format:
  dashboard:
    theme: [default, ./style.css]
    orientation: rows
    nav-buttons:
      - icon: github
        href: https://github.com/
    logo: epfl_logo.png
