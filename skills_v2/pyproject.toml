[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skeleton_helpers"
version = "0.1.0"
description = "Shared helpers for the data-analysis skeleton skills"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "duckdb>=0.9",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "ipykernel>=6.0",
    "plotly>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skeleton_helpers"]
